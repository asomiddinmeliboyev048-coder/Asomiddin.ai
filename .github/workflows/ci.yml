name: CI
concurrency:
  group: asomiddin-ai-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: find scripts worker -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
